services:

  # ==========================================================
  # NGINX
  # ==========================================================

  nginx:
    image: ${NGINX_IMAGE}
    container_name: ${NGINX_CONTAINER_NAME}
    restart: unless-stopped

    ports:
      - "${APP_PORT}:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro

    depends_on:
      php:
        condition: service_started

    networks:
      - saasforge


  # ==========================================================
  # PHP-FPM
  # ==========================================================

  php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION}
        UID: ${UID}
        GID: ${GID}

    container_name: ${PHP_CONTAINER_NAME}
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}

    depends_on:
      mariadb:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - saasforge


  # ==========================================================
  # QUEUE WORKER
  # ==========================================================

  queue:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION}
        UID: ${UID}
        GID: ${GID}

    container_name: ${QUEUE_CONTAINER_NAME}
    restart: unless-stopped

    working_dir: /var/www/html

    command: >
      /bin/sh -c '
        if [ -f artisan ]; then
          php artisan queue:work
          --sleep=${QUEUE_SLEEP}
          --tries=${QUEUE_TRIES}
          --timeout=${QUEUE_TIMEOUT};
        else
          echo "Laravel not installed. Waiting...";
          tail -f /dev/null;
        fi
      '

    volumes:
      - ./:/var/www/html

    depends_on:
      mariadb:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - saasforge


  # ==========================================================
  # SCHEDULER
  # ==========================================================

  scheduler:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION}
        UID: ${UID}
        GID: ${GID}

    container_name: ${SCHEDULER_CONTAINER_NAME}
    restart: unless-stopped

    working_dir: /var/www/html

    command: >
      /bin/sh -c '
        if [ -f artisan ]; then
          while true; do
            php artisan schedule:run;
            sleep 60;
          done;
        else
          echo "Laravel not installed. Waiting...";
          tail -f /dev/null;
        fi
      '

    volumes:
      - ./:/var/www/html

    depends_on:
      mariadb:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - saasforge


  # ==========================================================
  # MARIADB
  # ==========================================================

  mariadb:
    image: ${MARIADB_IMAGE}
    container_name: ${MARIADB_CONTAINER_NAME}
    restart: unless-stopped

    ports:
      - "${DB_FORWARD_PORT}:${DB_PORT}"

    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - saasforge


  # ==========================================================
  # REDIS
  # ==========================================================

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: unless-stopped

    ports:
      - "${REDIS_FORWARD_PORT}:${REDIS_PORT}"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - saasforge


  # ==========================================================
  # NODE / VITE
  # ==========================================================

  node:
    image: ${NODE_IMAGE}
    container_name: ${NODE_CONTAINER_NAME}
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    ports:
      - "${VITE_PORT}:5173"

    command: >
      /bin/sh -c '
        if [ -f package.json ]; then
          npm install &&
          npm run dev -- --host 0.0.0.0;
        else
          echo "package.json not found. Waiting for Laravel installation...";
          tail -f /dev/null;
        fi
      '

    networks:
      - saasforge


  # ==========================================================
  # PHPMYADMIN
  # ==========================================================

  phpmyadmin:
    image: ${PHPMYADMIN_IMAGE}
    container_name: ${PHPMYADMIN_CONTAINER_NAME}
    restart: unless-stopped

    ports:
      - "${PHPMYADMIN_PORT}:80"

    environment:
      PMA_HOST: mariadb
      PMA_PORT: ${DB_PORT}
      PMA_ARBITRARY: 1

    depends_on:
      mariadb:
        condition: service_healthy

    networks:
      - saasforge


# ============================================================
# NETWORK
# ============================================================

networks:

  saasforge:
    name: ${DOCKER_NETWORK}
    driver: bridge


# ============================================================
# PERSISTENT VOLUMES
# ============================================================

volumes:

  mariadb_data:
    name: ${MARIADB_VOLUME}
    driver: local

  redis_data:
    name: ${REDIS_VOLUME}
    driver: local
